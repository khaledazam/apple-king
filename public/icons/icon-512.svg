
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%" fx="50%" fy="25%">
      <stop offset="0%" stop-color="#15213b" />
      <stop offset="55%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#050812" />
    </radialGradient>

    <!-- Outer Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eac875" />
      <stop offset="35%" stop-color="#9d6d2b" />
      <stop offset="70%" stop-color="#fdf1c8" />
      <stop offset="100%" stop-color="#8c5d22" />
    </linearGradient>

    <!-- Crown Gold Gradient -->
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#8e6125" />
      <stop offset="20%" stop-color="#f7dc91" />
      <stop offset="40%" stop-color="#fff4cd" />
      <stop offset="60%" stop-color="#c9973e" />
      <stop offset="85%" stop-color="#f3d37f" />
      <stop offset="100%" stop-color="#936122" />
    </linearGradient>

    <!-- Ruby Gem Gradient -->
    <linearGradient id="ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7f77" />
      <stop offset="50%" stop-color="#b51b32" />
      <stop offset="100%" stop-color="#560613" />
    </linearGradient>

    <!-- Apple Silhouette Subtle Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base App Background with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="url(#goldBorder)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Royal Crown on Top -->
  <g transform="translate(166, 68) scale(1.88)">
    <!-- Crown Base -->
    <path d="M15 43 8 18l19 12 6-18 9 15L48 5l6 22 9-15 6 18 19-12-7 25Z" fill="url(#crownGold)" stroke="#f5d68d" stroke-width="1.2" stroke-linejoin="round" />
    <path d="m13 22 7 17h57l7-17M33 16l-4 18m19-24v24m15-18 4 18" stroke="#fff5d2" stroke-opacity=".7" stroke-width="1.1" stroke-linecap="round" />
    <path d="m17 42 62 0-1 11c-19 5-41 5-60 0Z" fill="url(#crownGold)" stroke="#b98a3e" stroke-width="1.1" />
    <path d="M19 44h58M20 52c18 4 38 4 56 0" stroke="#ffe5a1" stroke-width="1" stroke-linecap="round" />
    
    <!-- Crown Pearls -->
    <circle cx="8" cy="17" r="2.8" fill="url(#crownGold)" stroke="#fff" stroke-width=".5" />
    <circle cx="33" cy="11" r="2.8" fill="url(#crownGold)" stroke="#fff" stroke-width=".5" />
    <circle cx="48" cy="5" r="3.6" fill="url(#crownGold)" stroke="#fff" stroke-width=".6" />
    <circle cx="63" cy="11" r="2.8" fill="url(#crownGold)" stroke="#fff" stroke-width=".5" />
    <circle cx="88" cy="17" r="2.8" fill="url(#crownGold)" stroke="#fff" stroke-width=".5" />
    
    <!-- Ruby Jewel Center -->
    <path d="m48 43 4 4-4 4-4-4Z" fill="url(#ruby)" stroke="#ffe5a1" stroke-width=".8" />
    <circle cx="28" cy="47" r="1.6" fill="#fff0bd" />
    <circle cx="68" cy="47" r="1.6" fill="#fff0bd" />
  </g>

  <!-- Official Apple Silhouette Centered -->
  <g filter="url(#glow)" transform="translate(146, 178) scale(9.2)">
    <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701" fill="#FFFFFF" />
  </g>

  <!-- Arabic Brand Label: ملك التفاحه -->
  <text x="256" y="440" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="1">ملك التفاحه</text>
  <text x="256" y="470" text-anchor="middle" fill="#d4af37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="3">EGYPT • SENBELLAWEIN</text>
</svg>
