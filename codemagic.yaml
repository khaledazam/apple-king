workflows:
  mobilix-ios-simulator:
    name: Mobilix ERP iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: 3.47.1
      xcode: latest
    scripts:
      - name: Check Flutter app
        script: |
          cd "$CM_BUILD_DIR/mobile"
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build for iPhone Simulator
        script: |
          cd "$CM_BUILD_DIR/mobile"
          flutter build ios --simulator --debug --no-codesign --no-pub \
            --dart-define=ERP_URL=https://mobilix-erp.onrender.com
          ditto -c -k --keepParent build/ios/iphonesimulator/Runner.app \
            build/ios/Mobilix-iOS-Simulator.zip
    artifacts:
      - mobile/build/ios/Mobilix-iOS-Simulator.zip
